<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions · Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">₹</div>
        <span>Expense Tracker</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="transactions.html"><span class="nav-icon">📋</span> Transactions</a>
        <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
        <a href="budget.html"><span class="nav-icon">🎯</span> Budget</a>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary" data-action="logout">🚪 Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="flex gap-8" style="align-items:center;">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1>Transactions</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary" id="addTransactionBtn">+ Add Transaction</button>
          <div class="user-chip" id="userChip">
            <div class="avatar"></div>
            <span class="user-name"></span>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="card-header"><h3>Transaction History</h3></div>

          <div class="filters-bar">
            <div class="filter-group">
              <label for="filterType">Type</label>
              <select id="filterType">
                <option value="">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filterCategory">Category</label>
              <select id="filterCategory"><option value="">All Categories</option></select>
            </div>
            <div class="filter-group">
              <label for="filterDate">Specific Date</label>
              <input type="date" id="filterDate" />
            </div>
            <div class="filter-group">
              <label for="filterMonth">Month</label>
              <input type="month" id="filterMonth" />
            </div>
            <div class="filter-group" style="flex: 1; min-width: 180px;">
              <label for="searchInput">Search Description</label>
              <input type="text" id="searchInput" placeholder="Search..." />
            </div>
            <div class="filter-group">
              <label>&nbsp;</label>
              <button class="btn btn-secondary" id="clearFiltersBtn">Clear Filters</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="txTableBody"></tbody>
            </table>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/transaction-modal.js"></script>
  <script src="/js/transactions.js"></script>
</body>
</html>
