<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">₹</div>
        <span>Expense Tracker</span>
      </div>
      <h2>Create your account</h2>
      <p class="auth-subtitle">Start tracking your income and expenses</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Jane Doe" autocomplete="name" />
          <div class="field-error" id="err-name"></div>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          <div class="field-error" id="err-email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" />
          <div class="field-error" id="err-password"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
          <div class="field-error" id="err-confirmPassword"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
