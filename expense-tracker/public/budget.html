<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Planning · Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">₹</div>
        <span>Expense Tracker</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="transactions.html"><span class="nav-icon">📋</span> Transactions</a>
        <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
        <a href="budget.html"><span class="nav-icon">🎯</span> Budget</a>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary" data-action="logout">🚪 Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="flex gap-8" style="align-items:center;">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1>Budget Planning</h1>
        </div>
        <div class="topbar-right">
          <div class="user-chip" id="userChip">
            <div class="avatar"></div>
            <span class="user-name"></span>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="card-header">
            <h3>Set a Category Budget</h3>
            <select id="budgetMonthSelect" style="width: auto;"></select>
          </div>
          <form id="budgetForm" novalidate>
            <div class="form-row" style="grid-template-columns: 1fr 1fr auto; align-items: end;">
              <div class="form-group mt-0">
                <label for="budgetCategory">Category</label>
                <select id="budgetCategory"></select>
              </div>
              <div class="form-group mt-0">
                <label for="budgetLimit">Monthly Limit</label>
                <input type="number" id="budgetLimit" step="0.01" min="1" placeholder="e.g. 5000" />
                <div class="field-error" id="err-budgetLimit"></div>
              </div>
              <div class="form-group mt-0">
                <button type="submit" class="btn btn-primary" id="budgetSubmitBtn">Save Budget</button>
              </div>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card-header"><h3>Your Budgets</h3></div>
          <div class="budget-grid" id="budgetGrid"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/budget.js"></script>
</body>
</html>
