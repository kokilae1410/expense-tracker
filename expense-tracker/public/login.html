<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">₹</div>
        <span>Expense Tracker</span>
      </div>
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to manage your finances</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          <div class="field-error" id="err-email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <div class="field-error" id="err-password"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="/register.html">Create one</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
