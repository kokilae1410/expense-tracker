<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">₹</div>
        <span>Expense Tracker</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="transactions.html"><span class="nav-icon">📋</span> Transactions</a>
        <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
        <a href="budget.html"><span class="nav-icon">🎯</span> Budget</a>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary" data-action="logout">🚪 Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="flex gap-8" style="align-items:center;">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1>Profile</h1>
        </div>
        <div class="topbar-right">
          <div class="user-chip" id="userChip">
            <div class="avatar"></div>
            <span class="user-name"></span>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="profile-header">
            <div class="avatar" id="profileAvatar" style="width:64px;height:64px;font-size:24px;"></div>
            <div>
              <h2 id="profileNameDisplay"></h2>
              <p id="profileEmailDisplay"></p>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Account Details</h3></div>
          <form id="profileForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" />
                <div class="field-error" id="err-name"></div>
              </div>
              <div class="form-group">
                <label for="currency">Preferred Currency</label>
                <select id="currency">
                  <option value="INR">INR (₹)</option>
                  <option value="USD">USD ($)</option>
                  <option value="EUR">EUR (€)</option>
                  <option value="GBP">GBP (£)</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="monthlyBudgetGoal">Monthly Budget Goal</label>
              <input type="number" id="monthlyBudgetGoal" min="0" step="0.01" placeholder="e.g. 30000" />
            </div>
            <div class="form-group">
              <label>Avatar Color</label>
              <div class="color-swatches" id="colorSwatches"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="profileSubmitBtn" style="width: auto; padding-left: 28px; padding-right: 28px;">Save Changes</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header"><h3>Change Password</h3></div>
          <form id="passwordForm" novalidate>
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" autocomplete="current-password" />
              <div class="field-error" id="err-currentPassword"></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" autocomplete="new-password" />
                <div class="field-error" id="err-newPassword"></div>
              </div>
              <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" autocomplete="new-password" />
                <div class="field-error" id="err-confirmNewPassword"></div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="passwordSubmitBtn" style="width: auto; padding-left: 28px; padding-right: 28px;">Update Password</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
